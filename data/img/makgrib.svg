<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MAKGrib</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123f66"/>
      <stop offset="1" stop-color="#08243d"/>
    </linearGradient>
    <linearGradient id="gust" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <!-- Ground: a deep sea-chart blue, so the mark reads on any desktop. -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#sea)"/>

  <!-- Meridians and parallels, barely there: the chart underneath. -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="6" fill="none">
    <path d="M0 168 H512 M0 344 H512"/>
    <path d="M168 0 V512 M344 0 V512"/>
  </g>

  <!-- The wind: a barb, drawn the way a weather chart draws it - shaft
       flying with the wind, feathers raked back towards the tail. Warm
       against the cold ground, so it still carries at 16 px. -->
  <g fill="none" stroke="url(#gust)" stroke-width="32" stroke-linecap="round">
    <path d="M78 262 L 372 146"/>
    <path d="M150 233 L 196 148"/>
    <path d="M232 201 L 278 116"/>
  </g>
  <path d="M330 100 L 428 138 L 344 196 Z" fill="#ff8a3d"/>

  <!-- The sea: two crests, the half of the picture the boat is in. -->
  <g fill="none" stroke="#5fd0f5" stroke-width="30" stroke-linecap="round">
    <path d="M84 336 C 132 298, 180 298, 228 336 C 276 374, 324 374, 372 336 C 400 314, 428 308, 440 310"/>
    <path d="M84 420 C 132 382, 180 382, 228 420 C 276 458, 324 458, 372 420 C 400 398, 428 392, 440 394"/>
  </g>
</svg>
