# Прогнозы DWD, нарезанные плитками.
#
# У NOAA есть программа на сервере, которая режет прогноз по присланному
# прямоугольнику. Нам такое повторить нечем — своего сервера нет. Поэтому
# режем заранее сеткой квадратов, а телефон берёт те, что накрывают его
# экран, и склеивает их у себя.
#
# Резать заранее дёшево: чтобы получить один квадрат, всё равно надо
# скачать модель целиком, так что сто квадратов стоят столько же, сколько
# один. Дорого стоят модели, а не районы.
name: Плитки DWD

on:
  schedule:
    # ICON-EU выходит каждые три часа и выкладывается примерно через два.
    # GWAM и EWAM — в 00 и 12 UTC, выкладываются часа через три.
    - cron: '40 4,16 * * *'
  workflow_dispatch:
    inputs:
      sets:
        description: 'Какие наборы (через пробел), пусто — все'
        required: false
        default: ''
      days:
        description: 'На сколько суток вперёд'
        required: false
        default: '5'

permissions:
  contents: write           # чтобы положить готовые файлы в выпуск

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты для GRIB
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cdo libeccodes-tools python3-numpy
          python3 -m pip install --quiet eccodes-python || \
            python3 -m pip install --quiet eccodes

      - name: Нарезать
        env:
          DAYS: ${{ github.event.inputs.days || '5' }}
          WORK: /tmp/dwd
          OUT: out
          LC_ALL: C
        run: python3 tools/dwd-tiles.py ${{ github.event.inputs.sets }}

      - name: Сколько вышло
        run: |
          echo "файлов: $(ls out/*.grb2 | wc -l)"
          du -sh out

      - name: Выложить в выпуск «dwd»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub ограничивает не объём, а частоту: полторы тысячи
          # загрузок подряд он отбивает через сорок восемь секунд —
          # «secondary rate limit». Поэтому две меры.
          #
          # Первая: выпуск пересоздаём целиком. Замена файла на месте —
          # это два обращения, удаление и заливка; на чистом выпуске
          # хватает одного. Ссылка на файлы при этом не меняется: метка
          # у выпуска постоянная.
          gh release delete dwd --yes --cleanup-tag 2>/dev/null || true
          sleep 5
          # --prerelease обязателен. Без него выпуск с данными становится
          # «последним», и кнопка «Скачать» на сайте уводит людей в свалку
          # из трёхсот файлов .grb2 вместо приложения. Уже случалось.
          gh release create dwd --prerelease \
            --title "Данные: плитки прогнозов DWD (не приложение)" \
            --notes "Служебный выпуск: прогнозы немецкой службы погоды, нарезанные квадратами, для самой программы. Приложение — в выпуске с номером версии. Опись — manifest-v1.json, обновляется дважды в сутки."

          # Вторая: заливаем пачками по двадцать с передышкой, чтобы
          # держаться ниже порога. Триста семьдесят файлов при таком шаге
          # уходят минут за десять.
          n=0
          for f in out/*.grb2; do
            gh release upload dwd "$f" || { sleep 60; gh release upload dwd "$f"; }
            n=$((n+1))
            if [ $((n % 20)) = 0 ]; then
              echo "  залито $n"
              sleep 20
            fi
          done

          # Описи в самом конце: пока их нет, приложение просто не увидит
          # новых плиток — лучше так, чем половина выпуска с описью,
          # обещающей то, чего ещё не залили.
          gh release upload dwd out/*.json

      - name: "Сторож: «последний выпуск» должен быть приложением"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub подставляет в /releases/latest самый свежий выпуск, не
          # помеченный предварительным. Стоит однажды забыть --prerelease —
          # и кнопка «Скачать» на сайте уведёт человека в свалку из трёхсот
          # файлов .grb2. Уже случалось, поэтому проверяем каждый раз.
          t=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          echo "последний выпуск: $t"
          case "$t" in
            v*) echo "  это приложение — порядок" ;;
            *)  echo "  ОШИБКА: последним стал служебный выпуск «$t»."
                echo "  Кнопка «Скачать» на сайте сейчас ведёт не туда."
                exit 1 ;;
          esac
